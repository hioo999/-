# 直播 AIP 打造全案系统 - Docker Compose
# 遵循瑞小美部署规范：前后端分离 + Nginx 反向代理 + 独立网络

version: "3.8"

services:
  # ─── 后端服务 ──────────────────────────────────────────
  ip-backend:
    build: ./backend
    container_name: ip-system-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "${IP_BACKEND_PORT:-18000}:8000"
    volumes:
      - ./backend:/app
      - backend_data:/app/data
    networks:
      - ip_system_network
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── 前端服务 ──────────────────────────────────────────
  ip-frontend:
    build: ./frontend
    container_name: ip-system-frontend
    restart: unless-stopped
    ports:
      - "${IP_FRONTEND_PORT:-13000}:80"
    networks:
      - ip_system_network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ─── Nginx 反向代理 ────────────────────────────────────
  ip-nginx:
    image: nginx:1.25.4-alpine
    container_name: ip-system-nginx
    restart: unless-stopped
    ports:
      - "${IP_PROXY_PORT:-18080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - ip-backend
      - ip-frontend
    networks:
      - ip_system_network
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  backend_data:

networks:
  ip_system_network:
    driver: bridge
